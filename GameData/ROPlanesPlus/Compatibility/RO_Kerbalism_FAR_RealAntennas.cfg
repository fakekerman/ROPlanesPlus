// ============================================================================
// ROPlanesPlus: Kerbalism, FAR, RealAntennas, & RemoteTech Compatibility
// ============================================================================

// 1. Kerbalism Air Pump Life Support ProcessController
@PART[ROPlanes-Spitfire-Cockpit|ROPlanes-Bf109-Cockpit|ROPlanes-Me262-Cockpit|ROPlanes-B29-Cockpit|ROPlanes-MiG15-Cockpit|ROPlanes-F104-Cockpit|ROPlanes-F4-Cockpit|ROPlanes-Su27-Cockpit|ROPlanes-F16-Cockpit|ROPlanes-B52-Cockpit]:NEEDS[ProfileRealismOverhaul]:AFTER[RealismOverhaul]
{
	processConfigureExclude = true
	MODULE
	{
		name = ProcessController
		resource = _AirPump
		title = Air Pump
		capacity = #$/CrewCapacity$
		running = true
	}
}

// 2. Kerbalism Habitat Volumes, Surface Areas, & Unpressurized Settings
@PART[ROPlanes-Spitfire-Cockpit]:NEEDS[FeatureHabitat]:AFTER[zzzKerbalism]
{
	@MODULE[Habitat]
	{
		%volume = 1.05
		%surface = 2.4
		%max_pressure = 0
	}
}

