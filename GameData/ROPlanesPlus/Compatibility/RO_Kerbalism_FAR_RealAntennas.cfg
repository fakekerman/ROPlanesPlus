// 3. Ferram Aerospace Research (FAR) Mesh Voxelization Override
@PART[ROPlanes-Spitfire-Cockpit|ROPlanes-Bf109-Cockpit|ROPlanes-Me262-Cockpit|ROPlanes-B29-Cockpit|ROPlanes-MiG15-Cockpit|ROPlanes-F104-Cockpit|ROPlanes-F4-Cockpit|ROPlanes-Su27-Cockpit|ROPlanes-F16-Cockpit|ROPlanes-B52-Cockpit]:AFTER[FerramAerospaceResearch]
{
	@MODULE[GeometryPartModule]
	{
		%forceUseMeshes = true
	}
}

// 4. RealAntennas Integrated VHF/UHF Aviation Omni Radio
@PART[ROPlanes-Spitfire-Cockpit|ROPlanes-Bf109-Cockpit|ROPlanes-Me262-Cockpit|ROPlanes-B29-Cockpit|ROPlanes-MiG15-Cockpit|ROPlanes-F104-Cockpit|ROPlanes-F4-Cockpit|ROPlanes-Su27-Cockpit|ROPlanes-F16-Cockpit|ROPlanes-B52-Cockpit]:HAS[!MODULE[ModuleRealAntenna]]:AFTER[RealAntennas]:NEEDS[RealAntennas]
{
	!MODULE[ModuleDataTransmitter] {}
	%MODULE[ModuleRealAntenna] { %referenceGain = 1.5 }
}

// 5. RemoteTech Passive Antenna Fallback
@PART[ROPlanes-Spitfire-Cockpit|ROPlanes-Bf109-Cockpit|ROPlanes-Me262-Cockpit|ROPlanes-B29-Cockpit|ROPlanes-MiG15-Cockpit|ROPlanes-F104-Cockpit|ROPlanes-F4-Cockpit|ROPlanes-Su27-Cockpit|ROPlanes-F16-Cockpit|ROPlanes-B52-Cockpit]:NEEDS[RemoteTech&RealismOverhaul]:AFTER[RealismOverhaul]
{
	MODULE
	{
		name = ModuleSPU
	}
	MODULE
	{
		name = ModuleRTAntennaPassive
		TechRequired = start
		OmniRange = 50000
		TRANSMITTER
		{
			PacketInterval = 0.4
			PacketSize = 0.27
			PacketResourceCost = 0.01
		}
	}
}
