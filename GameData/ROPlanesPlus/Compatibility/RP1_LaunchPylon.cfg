// ============================================================================
// ROPlanesPlus: RP-1 tech tree placement of the Procedural Launch Pylon
// A starting part (unlockParts): air launches were routine from 1946 (B-29 + X-1).
// The plugin sets mass and cost from the pylon's size in the editor.
// ============================================================================

@PART[ROPlanes-ProcPylon]:AFTER[xxxRP0]:NEEDS[RP-0]
{
	%TechRequired = unlockParts
	%cost = 7
	%entryCost = 1
	%RP0conf = true
	@description ^=:$: <b><color=green>From ROPlanes+ mod</color></b>
}

@ENTRYCOSTMODS:AFTER[xxxRP-0]:NEEDS[RP-0]
{
	ROPlanes-ProcPylon = 1
}

@PART[ROPlanes-ProcPylon]:AFTER[zRP-0]:NEEDS[RP-0]
{
	%TechRequired = unlockParts
	%entryCost = 1
	%RP0conf = true
}
