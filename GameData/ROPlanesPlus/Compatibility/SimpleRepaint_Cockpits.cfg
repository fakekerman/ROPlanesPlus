// ============================================================================
// ROPlanesPlus: SimpleRepaint compatibility (generated by generate_configs.py)
// SimpleRepaint tints materials through B9PartSwitch; this keeps its colour on the fuselage skin so
// the canopy glass and the cockpit interior are not tinted. The cockpits default to Plain White,
// which SimpleRepaint needs to show its colours properly.
// ============================================================================

@PART[ROPlanes-Spitfire-Cockpit|ROPlanes-Bf109-Cockpit|ROPlanes-Me262-Cockpit|ROPlanes-B29-Cockpit|ROPlanes-MiG15-Cockpit|ROPlanes-F104-Cockpit|ROPlanes-F4-Cockpit|ROPlanes-Su27-Cockpit|ROPlanes-F16-Cockpit|ROPlanes-B52-Cockpit]:NEEDS[SimpleRepaint]:AFTER[zzzzzzSimpleRepaint]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SimpleRepaint]]
	{
		@SUBTYPE,*
		{
			@MATERIAL,*
			{
				transform = fuselage
			}
		}
	}
}
