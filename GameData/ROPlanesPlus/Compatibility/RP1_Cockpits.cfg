// ============================================================================
// ROPlanesPlus: RP-1 Tech Tree, Entry Costs, Crew Science, & Altitude Limits
// ============================================================================

// 1. Tag all ROPlanesPlus cockpits for RP-1 & ForAllKerbalkind Supersonic/Recon Crew Science
@PART[ROPlanes-Spitfire-Cockpit|ROPlanes-Bf109-Cockpit|ROPlanes-Me262-Cockpit|ROPlanes-B29-Cockpit|ROPlanes-MiG15-Cockpit|ROPlanes-F104-Cockpit|ROPlanes-F4-Cockpit|ROPlanes-Su27-Cockpit|ROPlanes-F16-Cockpit|ROPlanes-B52-Cockpit]:BEFORE[RP-0-Kerbalism]
{
	%capsuleTier = Cockpit
}

// 2. Crew Proficiency & Mission Training Times
@TRAININGTIMES:AFTER[RP-0]:NEEDS[RP-0]
{
	ROPlanes-Spitfire-Cockpit = GeneralAviation
	ROPlanes-Bf109-Cockpit = GeneralAviation
	ROPlanes-Me262-Cockpit = GeneralAviation
	ROPlanes-B29-Cockpit = GeneralAviation
	ROPlanes-MiG15-Cockpit = JetFighter
	ROPlanes-F104-Cockpit = JetFighter
	ROPlanes-F4-Cockpit = JetFighter
	ROPlanes-Su27-Cockpit = JetFighter
	ROPlanes-F16-Cockpit = JetFighter
	ROPlanes-B52-Cockpit = GeneralAviation
}

// 3. Ejection Seat Cost Modifiers
@PART[ROPlanes-Spitfire-Cockpit|ROPlanes-Bf109-Cockpit|ROPlanes-Me262-Cockpit|ROPlanes-MiG15-Cockpit|ROPlanes-F104-Cockpit|ROPlanes-Su27-Cockpit|ROPlanes-F16-Cockpit]:AFTER[RP-0]:NEEDS[RP-0]
{
	@MODULE[ModuleROEjectionSeat]
	{
		%cost = 35
	}
}
@PART[ROPlanes-F4-Cockpit|ROPlanes-B29-Cockpit|ROPlanes-B52-Cockpit]:AFTER[RP-0]:NEEDS[RP-0]
{
	@MODULE[ModuleROEjectionSeat]
	{
		%cost = 70
	}
}

// 4. RP-1 Tech Tree Placement & Part Tags (:FOR[xxxRP0])
@PART[ROPlanes-Spitfire-Cockpit]:AFTER[xxxRP0]:NEEDS[RP-0]
{
	%TechRequired = unlockParts
	%cost = 32
	%entryCost = 1
	%RP0conf = true
	@description ^=:$: <b><color=green>From ROPlanes+ mod</color></b>

	%MODULE[ModuleTagList] { tag = Cockpit }
	MODULE { name = ModuleNoEVA }
	%MODULE[ModuleTagList] { tag = NoResourceCostMult }
	MODULE { name = ModuleNonReentryRated }
	MODULE { name = ModuleUnpressurizedCockpit }
}

