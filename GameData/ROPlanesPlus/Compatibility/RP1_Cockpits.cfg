{
	ROPlanes-Spitfire-Cockpit = 1
	ROPlanes-Bf109-Cockpit = 1
	ROPlanes-Me262-Cockpit = 1
	ROPlanes-B29-Cockpit = 1
	ROPlanes-MiG15-Cockpit = 2500
	ROPlanes-F104-Cockpit = 5000
	ROPlanes-F4-Cockpit = 8500
	ROPlanes-Su27-Cockpit = 12000
	ROPlanes-F16-Cockpit = 9500
