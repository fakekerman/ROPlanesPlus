}

// 6. Cockpit Service Ceilings / Crew Death Altitudes (:FOR[zRP-0])
@PART[ROPlanes-Spitfire-Cockpit]:AFTER[zRP-0]:NEEDS[RP-0]
{
	@MODULE[ModuleUnpressurizedCockpit],*
	{
		%crewDeathAltitude = 14000
	}
}

