// ============================================================================
// ROPlanesPlus: RP-1 procedural propeller engines
// Costs follow SXT's AJE engines in RP-1 (Merlin 66 = 20, R-2800 = 24-27, NK-12M = 400);
// the plugin sets the real cost of each design (cylinders, power, contra-props) in the editor.
// ============================================================================

@PART[ROPlanes-ProcProp]:AFTER[xxxRP0]:NEEDS[RP-0]
{
	%TechRequired = unlockParts
	%cost = 26
	%entryCost = 1
	%RP0conf = true
	@description ^=:$: <b><color=green>From ROPlanes+ mod</color></b>
}

@ENTRYCOSTMODS:AFTER[xxxRP-0]:NEEDS[RP-0]
{
	ROPlanes-ProcProp = 1
}

@PART[ROPlanes-ProcProp]:AFTER[zRP-0]:NEEDS[RP-0]
{
	%TechRequired = unlockParts
	%entryCost = 1
	%RP0conf = true
}
