// ============================================================================
// ROPlanesPlus: RealismOverhaul, AJE (SolverEngines) & FAR propeller patches
// ============================================================================

// 1. FAR never voxelizes the spinning hubs, blades or blur discs
@FARPartModuleTransformExceptions:AFTER[FerramAerospaceResearch]:NEEDS[FerramAerospaceResearch]
{
	FARPartModuleException
	{
		PartModuleName = ModuleProceduralPropeller
		TransformException = frontHubTransformName
		TransformException = rearHubTransformName
		TransformException = frontBladesTransformName
		TransformException = rearBladesTransformName
		TransformException = frontDiscTransformName
		TransformException = rearDiscTransformName
	}
}

// 2. FAR voxelizes the procedural cowling & spinner colliders
@PART[ROPlanes-ProcProp]:AFTER[FerramAerospaceResearch]
{
	@MODULE[GeometryPartModule]
	{
		%forceUseColliders = True
		%forceUseMeshes = False
		%ignoreIfNoRenderer = False
	}
}

// 3. RealismOverhaul
@PART[ROPlanes-ProcProp]:AFTER[RealismOverhaul]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	%maxTemp = 1973.15
	%skinMaxTemp = 2200.0
}

// 4. AJE: start-up values for the default engine. ModuleProceduralPropeller rewrites every
//    field and calls CreateEngine() whenever the engine or preset changes.
@PART[ROPlanes-ProcProp]:BEFORE[AJE]:NEEDS[AJE]
{
	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesAJEPropeller
		%IspMultiplier = 1
		%useOxygen = true
		%power = 2100
		%displacement = 2804.5
		%compression = 6.75
		%minRPM = 2200
		%maxRPM = 2800
		%gearratio = 0.45
		%BSFC = 1.104e-07
		%coolerEffic = 0.35
		%coolerMin = 5
		%ramAir = 0.5
		%exhaustThrust = 1
		%meredithEffect = 0.005
		%boost0 = 60
		%rated0 = 10
		%boost1 = 52.5
		%rated1 = 7950
		%cost1 = 347
		%switchAlt = 1500
		%turbo = false
		%wastegateMP = 60
		%propName = HS6501A-0x4
		%propDiam = 4.01
		%CtTweak = 1.0
		%CpTweak = 1.0
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = AvGas
			ratio = 1.0
			DrawGauge = True
			resourceFlowMode = ALL_VESSEL_BALANCE
		}
	}
}
