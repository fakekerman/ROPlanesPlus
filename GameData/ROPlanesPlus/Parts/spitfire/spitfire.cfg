PART
{
	name = ROPlanes-Spitfire-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/spitfire/spitfire
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 0.9375 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 1.65, -0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -1.75, 0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, 0.56, 0.0, 0.0, -1.0, 1

	TechRequired = unlockParts
	entryCost = 1
	cost = 32
	category = Pods
	subcategory = 0
	title = Supermarine Spitfire Cockpit
	manufacturer = Supermarine
	description = Single-seat fighter cockpit section of the Supermarine Spitfire at its real size, from the firewall to behind the razorback glazing. Round 0.9375 m rings at both ends: the front takes the Procedural Propeller Engine, the back a standard 0.9375 m fuselage. Real size: 3.4 m long, 0.9375 m round rear ring. Versions (switch in the editor): Mk IX (high back), Mk XVI (low back, bubble canopy). Paint schemes: Plain White, RAF Day Fighter, Desert (Middle East), Photo Recon Blue.

	tags = cockpit, plane, fighter, ww2, prop, propeller, spitfire, supermarine, inline, merlin, griffon

	attachRules = 1,1,1,1,0

	mass = 0.31
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 1.0

	skinTempTag = Aluminum
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 1
	bulkheadProfiles = size0p5, srf

	INTERNAL
	{
		name = rooldfighterInternal
		offset = 0.0, 0.0, 0.0
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.2
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = SM-I
		basemass = 0.31
		baseCost = -1
		volume = 180

		TANK
		{
			name = ElectricCharge
			amount = 2900
			maxAmount = 2900
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 46
			maxAmount = 46
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = mk9
			title = Mk IX (high back)
			descriptionSummary = Razorback fuselage with the sliding Malcolm hood.
			transform = variant_mk9
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 1.65, -0
			}
		}
		SUBTYPE
		{
			name = mk16
			title = Mk XVI (low back, bubble canopy)
			descriptionSummary = Cut-down rear fuselage with an all-round-vision bubble canopy.
			transform = variant_mk16
			addedMass = 0.004
			addedCost = 1
			NODE
			{
				name = top
				position = 0, 1.65, -0
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/spitfire/spitfire_white
				currentTexture = spitfire_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = raf
			title = RAF Day Fighter
			primaryColor = #3F4A31
			secondaryColor = #8E9393
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/spitfire/spitfire_raf
				currentTexture = spitfire_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = desert
			title = Desert (Middle East)
			primaryColor = #A88C5E
			secondaryColor = #7393B8
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/spitfire/spitfire_desert
				currentTexture = spitfire_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = pru
			title = Photo Recon Blue
			primaryColor = #4C6C86
			secondaryColor = #4C6C86
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/spitfire/spitfire_pru
				currentTexture = spitfire_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.04
		IsEnabled = false

		SEAT
		{
			colliderOffset = 0, 0, -1.3298
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
