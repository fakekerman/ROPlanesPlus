PART
{
	name = ROPlanes-B52-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/b52/b52
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 3 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 3.6, 0.6, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -6.9, 0, 0.0, -1.0, 0.0, 2
	node_attach = 0.0, 0.0, 1.63, 0.0, 0.0, -1.0, 1

	TechRequired = matureSupersonic
	entryCost = 38000
	cost = 1950
	category = Pods
	subcategory = 0
	title = Boeing B-52 Stratofortress Cockpit
	manufacturer = #roMfrBoeing
	description = Forward fuselage of the Boeing B-52 Stratofortress strategic bomber and X-15 mothership, with the raised six-window flight deck and the chin radome. Real size: 10.5 m long, 3 m round rear ring. Versions (switch in the editor): B-52H (EVS blisters), B-52D (smooth chin). Paint schemes: Plain White, Gunship Grey, SIOP Camouflage, Southeast Asia (black belly).

	tags = cockpit, plane, bomber, heavy, jet, b52, b-52, stratofortress, boeing, nb52, x15, airlaunch, mothership

	attachRules = 1,1,1,1,0

	mass = 3.6
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 0.5

	skinTempTag = Aluminum
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 4
	bulkheadProfiles = size2p5, srf

	INTERNAL
	{
		name = kossakint
		offset = 0.0, 0.0, -1.10
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 1.2
		}
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 1
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = Fuselage
		basemass = 3.6
		baseCost = -1
		volume = 1800

		TANK
		{
			name = ElectricCharge
			amount = 43200
			maxAmount = 43200
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 360
			maxAmount = 360
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = h
			title = B-52H (EVS blisters)
			descriptionSummary = Late nose with the two electro-optical viewing system turrets under the chin.
			transform = variant_h
			addedMass = 0.15
			addedCost = 3
			NODE
			{
				name = top
				position = 0, 3.6, 0.6
			}
		}
		SUBTYPE
		{
			name = d
			title = B-52D (smooth chin)
			descriptionSummary = Early clean nose without the EVS blisters.
			transform = variant_d
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 3.6, 0.6
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/b52/b52_white
				currentTexture = b52_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = gunship
			title = Gunship Grey
			primaryColor = #6E7276
			secondaryColor = #6E7276
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/b52/b52_gunship
				currentTexture = b52_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = siop
			title = SIOP Camouflage
			primaryColor = #7F7454
			secondaryColor = #E6E6E0
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/b52/b52_siop
				currentTexture = b52_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = sea
			title = Southeast Asia (black belly)
			primaryColor = #9C8858
			secondaryColor = #16181A
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/b52/b52_sea
				currentTexture = b52_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.18
		IsEnabled = true

		SEAT
		{
			colliderOffset = -0.5, 0.1, -1.99
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = -0.05, 0.12, -1
		}
		SEAT
		{
			colliderOffset = 0.5, 0.1, -1.99
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0.05, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
