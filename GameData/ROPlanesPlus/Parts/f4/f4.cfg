PART
{
	name = ROPlanes-F4-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/f4/f4
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 1.875 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 5.5, -0.02, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -3.4, 0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, 0.844, 0.0, 0.0, -1.0, 1

	TechRequired = highSpeedFlight
	entryCost = 8500
	cost = 480
	category = Pods
	subcategory = 0
	title = McDonnell Douglas F-4 Phantom II Cockpit
	manufacturer = #roMfrMcDonnell
	description = Two-seat tandem forward fuselage of the McDonnell Douglas F-4 Phantom II, pilot in front and weapons officer behind. Real size: 5.7-9.2 m long, 1.875 m round rear ring. Versions (switch in the editor): F-4E gun nose, F-4J radar nose, Open front (0.9375 m). Paint schemes: Plain White, Southeast Asia Camouflage, Hill Grey II, Navy Gull Grey / White, European One (wrap-around).

	tags = cockpit, plane, fighter, supersonic, interceptor, phantom, f4, f-4, mcdonnell, tandem, j79

	attachRules = 1,1,1,1,0

	mass = 1.05
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 0.1

	skinTempTag = Titanium
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 2
	bulkheadProfiles = size1p5, srf

	INTERNAL
	{
		name = rofighterinlineInternal
		offset = 0.0, 0.0, 0.0
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 1.25
		}
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 1
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = Fuselage
		basemass = 1.05
		baseCost = -1
		volume = 280

		TANK
		{
			name = ElectricCharge
			amount = 21600
			maxAmount = 21600
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 110
			maxAmount = 110
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = e
			title = F-4E gun nose
			descriptionSummary = Short radome (APQ-120) with the M61 gun fairing under the nose.
			transform = variant_e
			addedMass = 0.3
			addedCost = 4
			NODE
			{
				name = top
				position = 0, 5.5, -0.02
			}
		}
		SUBTYPE
		{
			name = j
			title = F-4J radar nose
			descriptionSummary = Long Navy radome (AWG-10) without the gun.
			transform = variant_j
			addedMass = 0.22
			addedCost = 3
			NODE
			{
				name = top
				position = 0, 5.8, -0.02
			}
		}
		SUBTYPE
		{
			name = open
			title = Open front (0.9375 m)
			descriptionSummary = Ends in a round 0.9375 m ring for your own nose cone.
			transform = variant_open
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 2.26, 0.06
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f4/f4_white
				currentTexture = f4_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = sea
			title = Southeast Asia Camouflage
			primaryColor = #9C8858
			secondaryColor = #C9C9C2
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f4/f4_sea
				currentTexture = f4_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = hill
			title = Hill Grey II
			primaryColor = #6A7277
			secondaryColor = #8E959A
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f4/f4_hill
				currentTexture = f4_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = navy
			title = Navy Gull Grey / White
			primaryColor = #9DA2A3
			secondaryColor = #ECECE7
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f4/f4_navy
				currentTexture = f4_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = euro1
			title = European One (wrap-around)
			primaryColor = #3D463A
			secondaryColor = #3D463A
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f4/f4_euro1
				currentTexture = f4_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.09
		IsEnabled = true

		SEAT
		{
			colliderOffset = 0, 0.7, -1.6674
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0, 0.12, -1
		}
		SEAT
		{
			colliderOffset = 0, -0.7, -1.6773
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
