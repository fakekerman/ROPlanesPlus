PART
{
	name = ROPlanes-F16-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/f16/f16
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 1.5 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 3.95, 0.18, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -3, 0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, 0.731, 0.0, 0.0, -1.0, 1

	TechRequired = matureTurbofans
	entryCost = 9500
	cost = 950
	category = Pods
	subcategory = 0
	title = General Dynamics F-16C Fighting Falcon Cockpit
	manufacturer = General Dynamics / Lockheed Martin
	description = Forward fuselage of the F-16 Fighting Falcon: frameless gold-tinted bubble canopy, chined forebody and the formation lights on its flanks. Real size: 5.0-7.0 m long, 1.5 m round rear ring. Versions (switch in the editor): Radome and pitot, Open front (0.9375 m). Paint schemes: Plain White, Two-Tone Grey, Aggressor Desert, Aggressor Blue.

	tags = cockpit, plane, fighter, supersonic, viper, falcon, f16, f-16, general dynamics, lockheed, f100, f110

	attachRules = 1,1,1,1,0

	mass = 0.62
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 0.1

	skinTempTag = Titanium
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 1
	bulkheadProfiles = size1p2, srf

	INTERNAL
	{
		name = mk1InlineInternal
		offset = 0.0, 0.0, 0.0
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 1.0
		}
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 1
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		basemass = 0.62
		baseCost = -1
		volume = 240

		TANK
		{
			name = ElectricCharge
			amount = 18000
			maxAmount = 18000
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 80
			maxAmount = 80
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = nose
			title = Radome and pitot
			descriptionSummary = Radome (APG-68 radar) with the nose pitot.
			transform = variant_nose
			addedMass = 0.18
			addedCost = 4
			NODE
			{
				name = top
				position = 0, 3.95, 0.18
			}
		}
		SUBTYPE
		{
			name = open
			title = Open front (0.9375 m)
			descriptionSummary = Ends in a round 0.9375 m ring for your own nose cone.
			transform = variant_open
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 2.01, 0.115
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f16/f16_white
				currentTexture = f16_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = grey
			title = Two-Tone Grey
			primaryColor = #7A8287
			secondaryColor = #A9B0B5
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f16/f16_grey
				currentTexture = f16_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = desert
			title = Aggressor Desert
			primaryColor = #B49465
			secondaryColor = #C9B48E
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f16/f16_desert
				currentTexture = f16_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = blue
			title = Aggressor Blue
			primaryColor = #4E6A86
			secondaryColor = #A8B8C6
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f16/f16_blue
				currentTexture = f16_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.05
		IsEnabled = true

		SEAT
		{
			colliderOffset = 0, 0, -1.6398
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
