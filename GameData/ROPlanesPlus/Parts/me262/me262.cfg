PART
{
	name = ROPlanes-Me262-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/me262/me262
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 1.25 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 2.85, 0.09, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -1.85, 0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, 0.649, 0.0, 0.0, -1.0, 1

	TechRequired = unlockParts
	entryCost = 1
	cost = 55
	category = Pods
	subcategory = 0
	title = Messerschmitt Me 262 Schwalbe Cockpit
	manufacturer = Messerschmitt AG
	description = Forward fuselage of the Messerschmitt Me 262 Schwalbe, the first operational jet fighter, with its triangular "shark" cross-section and teardrop canopy. Real size: 3.1-4.7 m long, 1.25 m round rear ring. Versions (switch in the editor): A-1a cannon nose, Open front (0.9375 m). Paint schemes: Plain White, RLM 81/82 over 76, RLM 74/75 over 76, Bare Metal (late war).

	tags = cockpit, plane, fighter, jet, ww2, me262, me-262, schwalbe, messerschmitt, jumo

	attachRules = 1,1,1,1,0

	mass = 0.38
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 1.0

	skinTempTag = Aluminum
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 1
	bulkheadProfiles = size1, srf

	INTERNAL
	{
		name = rooldfighterInternal
		offset = 0.0, 0.0, 0.0
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.35
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = SM-I
		basemass = 0.38
		baseCost = -1
		volume = 220

		TANK
		{
			name = ElectricCharge
			amount = 3600
			maxAmount = 3600
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 50
			maxAmount = 50
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = nose
			title = A-1a cannon nose
			descriptionSummary = Nose bay with the ports of four MK 108 cannon.
			transform = variant_nose
			addedMass = 0.06
			addedCost = 2
			NODE
			{
				name = top
				position = 0, 2.85, 0.09
			}
		}
		SUBTYPE
		{
			name = open
			title = Open front (0.9375 m)
			descriptionSummary = Ends in a round 0.9375 m ring for your own nose or intake.
			transform = variant_open
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 1.26, 0.015
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/me262/me262_white
				currentTexture = me262_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = rlm81
			title = RLM 81/82 over 76
			primaryColor = #574A3B
			secondaryColor = #A9B8BE
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/me262/me262_rlm81
				currentTexture = me262_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = rlm74
			title = RLM 74/75 over 76
			primaryColor = #3E4542
			secondaryColor = #A9B8C2
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/me262/me262_rlm74
				currentTexture = me262_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = metal
			title = Bare Metal (late war)
			primaryColor = #B9BCBC
			secondaryColor = #B9BCBC
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/me262/me262_metal
				currentTexture = me262_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.04
		IsEnabled = false

		SEAT
		{
			colliderOffset = 0, 0, -1.4338
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
