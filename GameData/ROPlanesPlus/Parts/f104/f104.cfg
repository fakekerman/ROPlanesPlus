PART
{
	name = ROPlanes-F104-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/f104/f104
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 1.5 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 4.15, -0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -2.45, 0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, 0.657, 0.0, 0.0, -1.0, 1

	TechRequired = matureSupersonic
	entryCost = 5000
	cost = 260
	category = Pods
	subcategory = 0
	title = Lockheed F-104G Starfighter Cockpit
	manufacturer = #roMfrLockheed
	description = Forward fuselage of the Lockheed F-104 Starfighter Mach 2 interceptor: needle radome, pitot boom and the narrow clamshell canopy. Real size: 4.3-6.6 m long, 1.5 m round rear ring. Versions (switch in the editor): Radome and pitot boom, Open front (0.9375 m). Paint schemes: Plain White, Natural Metal, NATO Green/Grey, Gull Grey.

	tags = cockpit, plane, fighter, supersonic, interceptor, f104, f-104, starfighter, lockheed, century, j79

	attachRules = 1,1,1,1,0

	mass = 0.55
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 0.1

	skinTempTag = Titanium
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 1
	bulkheadProfiles = size1p2, srf

	INTERNAL
	{
		name = mk1CockpitInternal
		offset = 0.0, 0.0, 0.0
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 1.0
		}
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 1
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = Fuselage
		basemass = 0.55
		baseCost = -1
		volume = 200

		TANK
		{
			name = ElectricCharge
			amount = 10800
			maxAmount = 10800
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 65
			maxAmount = 65
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = nose
			title = Radome and pitot boom
			descriptionSummary = Long needle radome (NASARR radar) with the pitot boom.
			transform = variant_nose
			addedMass = 0.12
			addedCost = 3
			NODE
			{
				name = top
				position = 0, 4.15, -0
			}
		}
		SUBTYPE
		{
			name = open
			title = Open front (0.9375 m)
			descriptionSummary = Ends in a round 0.9375 m ring for your own nose cone.
			transform = variant_open
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 1.81, 0.005
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f104/f104_white
				currentTexture = f104_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = metal
			title = Natural Metal
			primaryColor = #C0C3C4
			secondaryColor = #C0C3C4
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f104/f104_metal
				currentTexture = f104_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = nato
			title = NATO Green/Grey
			primaryColor = #4C5A3E
			secondaryColor = #B9BDBD
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f104/f104_nato
				currentTexture = f104_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = gull
			title = Gull Grey
			primaryColor = #9DA2A3
			secondaryColor = #E7E7E2
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/f104/f104_gull
				currentTexture = f104_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.05
		IsEnabled = true

		SEAT
		{
			colliderOffset = 0, 0, -1.5181
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
