PART
{
	name = ROPlanes-MiG15-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/mig15/mig15
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 1.5 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 2.8, -0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -2.05, 0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, 0.724, 0.0, 0.0, -1.0, 1

	TechRequired = supersonicFlightRP0
	entryCost = 2500
	cost = 220
	category = Pods
	subcategory = 0
	title = Mikoyan-Gurevich MiG-15bis Cockpit
	manufacturer = Mikoyan-Gurevich (OKB-155)
	description = Forward fuselage of the Soviet MiG-15bis transonic jet fighter: round barrel, sliding bubble canopy and the nose intake with its splitter. Real size: 4.3-4.8 m long, 1.5 m round rear ring. Versions (switch in the editor): Nose intake, Open front (0.9375 m). Paint schemes: Plain White, Natural Metal, Air Superiority Grey, Warsaw Pact Camouflage.

	tags = cockpit, plane, fighter, jet, mig, mig15, mig-15, fagot, soviet, mikoyan, vk1

	attachRules = 1,1,1,1,0

	mass = 0.44
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 0.5

	skinTempTag = Aluminum
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 1
	bulkheadProfiles = size1p2, srf

	INTERNAL
	{
		name = mk1CockpitInternal
		offset = 0.0, 0.0, 0.0
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.75
		}
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 1
	}

	// Built-in nose intake (the open-front version keeps it for your own intake part)
	MODULE
	{
		name = ModuleResourceIntake
		resourceName = IntakeAir
		checkForOxygen = true
		area = 0.006
		intakeSpeed = 12
		intakeTransformName = intakeTransform
	}
	RESOURCE
	{
		name = IntakeAir
		amount = 0.6
		maxAmount = 0.6
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = SM-I
		basemass = 0.44
		baseCost = -1
		volume = 280

		TANK
		{
			name = ElectricCharge
			amount = 7200
			maxAmount = 7200
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 60
			maxAmount = 60
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = intake
			title = Nose intake
			descriptionSummary = The real nose: round intake lip with the splitter that feeds the ducts around the cockpit.
			transform = variant_intake
			addedMass = 0.03
			addedCost = 1
			NODE
			{
				name = top
				position = 0, 2.8, -0
			}
		}
		SUBTYPE
		{
			name = open
			title = Open front (0.9375 m)
			descriptionSummary = Ends in a round 0.9375 m ring for your own intake or nose.
			transform = variant_open
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 2.21, -0.005
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/mig15/mig15_white
				currentTexture = mig15_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = metal
			title = Natural Metal
			primaryColor = #BFC2C3
			secondaryColor = #BFC2C3
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/mig15/mig15_metal
				currentTexture = mig15_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = grey
			title = Air Superiority Grey
			primaryColor = #8E959A
			secondaryColor = #A7AEB2
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/mig15/mig15_grey
				currentTexture = mig15_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = pact
			title = Warsaw Pact Camouflage
			primaryColor = #58603E
			secondaryColor = #9DB6C8
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/mig15/mig15_pact
				currentTexture = mig15_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.04
		IsEnabled = true

		SEAT
		{
			colliderOffset = 0, 0, -1.5779
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
