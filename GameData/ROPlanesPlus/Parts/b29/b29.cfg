PART
{
	name = ROPlanes-B29-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/b29/b29
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 3 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 1.4, -0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -5, 0, 0.0, -1.0, 0.0, 2
	node_attach = 0.0, 0.0, 1.375, 0.0, 0.0, -1.0, 1

	TechRequired = unlockParts
	entryCost = 1
	cost = 320
	category = Pods
	subcategory = 0
	title = Boeing B-29 Superfortress Cockpit
	manufacturer = #roMfrBoeing
	description = Pressurised forward crew compartment of the Boeing B-29 Superfortress bomber and X-1 mothership, with the navigator's astrodome and the forward gun turrets. Real size: 6.4 m long, 3 m round rear ring. Versions (switch in the editor): Glazed nose, Solid nose (crew windows only). Paint schemes: Plain White, Natural Metal, Olive Drab / Neutral Grey, Korean War Night Black.

	tags = cockpit, plane, bomber, heavy, prop, propeller, b29, b-29, superfortress, boeing, airlaunch, mothership

	attachRules = 1,1,1,1,0

	mass = 2.1
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 1.0

	skinTempTag = Aluminum
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 4
	bulkheadProfiles = size2p5, srf

	INTERNAL
	{
		name = kossakint
		offset = 0.0, 0.0, -0.40
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.6
		}
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 1
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = SM-I
		basemass = 2.1
		baseCost = -1
		volume = 950

		TANK
		{
			name = ElectricCharge
			amount = 21600
			maxAmount = 21600
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 240
			maxAmount = 240
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = glazed
			title = Glazed nose
			descriptionSummary = The famous greenhouse nose for the pilots and the bombardier.
			transform = variant_glazed
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 1.4, -0
			}
		}
		SUBTYPE
		{
			name = solid
			title = Solid nose (crew windows only)
			descriptionSummary = Metal nose with side windows for the pilots, for transport and tanker conversions.
			transform = variant_solid
			addedMass = 0.05
			addedCost = 1
			NODE
			{
				name = top
				position = 0, 1.4, -0
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/b29/b29_white
				currentTexture = b29_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = metal
			title = Natural Metal
			primaryColor = #C3C6C7
			secondaryColor = #C3C6C7
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/b29/b29_metal
				currentTexture = b29_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = od
			title = Olive Drab / Neutral Grey
			primaryColor = #4B5320
			secondaryColor = #8A8D8F
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/b29/b29_od
				currentTexture = b29_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = night
			title = Korean War Night Black
			primaryColor = #C3C6C7
			secondaryColor = #16181A
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/b29/b29_night
				currentTexture = b29_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.16
		IsEnabled = false

		SEAT
		{
			colliderOffset = -0.45, 0.35, -1.6979
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = -0.05, 0.12, -1
		}
		SEAT
		{
			colliderOffset = 0.45, 0.35, -1.6979
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0.05, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
