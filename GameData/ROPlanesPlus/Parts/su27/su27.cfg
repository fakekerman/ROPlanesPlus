PART
{
	name = ROPlanes-Su27-Cockpit
	module = Part
	author = ROPlanesPlus

	RSSROConfig = True

	// Model, textures and icon are built by generate_cockpits.py (Blender); do not edit by hand.
	MODEL
	{
		model = ROPlanesPlus/Parts/su27/su27
	}
	scale = 1.0
	rescaleFactor = 1.0

	// +Y forward, -Z up (canopy). Origin at the pilot station. The rear ring is a true 1.875 m circle;
	// the front node moves with the version (see ModuleB9PartSwitch below).
	node_stack_top = 0, 4.55, 0.28, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0, -3.3, 0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, 0.822, 0.0, 0.0, -1.0, 1

	TechRequired = refinedTurbofans
	entryCost = 12000
	cost = 1150
	category = Pods
	subcategory = 0
	title = Sukhoi Su-27S Flanker Cockpit
	manufacturer = Sukhoi OKB
	description = Forward fuselage of the Sukhoi Su-27 Flanker air-superiority fighter: drooped radome, IRST ball ahead of the big bubble canopy and the dorsal hump behind it. Real size: 5.3-7.8 m long, 1.875 m round rear ring. Versions (switch in the editor): Radome and pitot, Open front (1.25 m). Paint schemes: Plain White, Flanker Blue-Grey, Navy Grey, Modern Dark Grey, Ukrainian Digital.

	tags = cockpit, plane, fighter, supersonic, flanker, su27, su-27, sukhoi, al31, soviet, modern

	attachRules = 1,1,1,1,0

	mass = 0.9
	dragModelType = default
	maximum_drag = 0.08
	minimum_drag = 0.08
	angularDrag = 1.0
	crashTolerance = 10
	breakingForce = 2000
	breakingTorque = 2000
	skinInternalConductionMult = 0.1

	skinTempTag = Titanium
	internalTempTag = Instruments

	vesselType = Plane
	CrewCapacity = 1
	bulkheadProfiles = size1p5, srf

	INTERNAL
	{
		name = mk1InlineInternal
		offset = 0.0, 0.0, 0.0
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 1.15
		}
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 1
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		basemass = 0.9
		baseCost = -1
		volume = 300

		TANK
		{
			name = ElectricCharge
			amount = 21600
			maxAmount = 21600
		}

		UNMANAGED_RESOURCE
		{
			name = Oxygen
			amount = 90
			maxAmount = 90
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitVersion
		switcherDescription = Version
		switcherDescriptionPlural = Versions
		affectDragCubes = true
		affectFARVoxels = true
		switchInFlight = false
		SUBTYPE
		{
			name = nose
			title = Radome and pitot
			descriptionSummary = Drooped radome (N001 radar) with the nose pitot.
			transform = variant_nose
			addedMass = 0.28
			addedCost = 4
			NODE
			{
				name = top
				position = 0, 4.55, 0.28
			}
		}
		SUBTYPE
		{
			name = open
			title = Open front (1.25 m)
			descriptionSummary = Ends in a round 1.25 m ring for your own nose cone.
			transform = variant_open
			addedMass = 0
			addedCost = 0
			NODE
			{
				name = top
				position = 0, 1.9875, 0.13
			}
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = cockpitPaint
		switcherDescription = Paint
		switcherDescriptionPlural = Paint schemes
		affectDragCubes = false
		affectFARVoxels = false
		switchInFlight = false
		SUBTYPE
		{
			name = white
			title = Plain White
			primaryColor = #EDEDEA
			secondaryColor = #EDEDEA
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/su27/su27_white
				currentTexture = su27_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = flanker
			title = Flanker Blue-Grey
			primaryColor = #9FB1C1
			secondaryColor = #B8C7D2
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/su27/su27_flanker
				currentTexture = su27_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = navy
			title = Navy Grey
			primaryColor = #7D878F
			secondaryColor = #A3ACB2
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/su27/su27_navy
				currentTexture = su27_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = modern
			title = Modern Dark Grey
			primaryColor = #55606A
			secondaryColor = #6E7A84
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/su27/su27_modern
				currentTexture = su27_white
				shaderProperty = _MainTex
			}
		}
		SUBTYPE
		{
			name = ukraine
			title = Ukrainian Digital
			primaryColor = #A9B9C6
			secondaryColor = #C3CFD8
			TEXTURE
			{
				texture = ROPlanesPlus/Parts/su27/su27_ukraine
				currentTexture = su27_white
				shaderProperty = _MainTex
			}
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}

	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = crewReport
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		xmitDataScalar = 1.0
		usageReqMaskInternal = 5
		usageReqMaskExternal = -1
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.8
	}

	MODULE
	{
		name = ModuleROEjectionSeat
		mass = 0.05
		IsEnabled = true

		SEAT
		{
			colliderOffset = 0, 0, -1.7298
			colliderRotAngles = -90.0, 0.0, 0.0
			forceDir = 0, 0.12, -1
		}
	}

	// Cockpit / instrument lights: brightens the emissive map (canopy glow, formation lights)
	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = Toggle Cockpit Lights
		eventOnName = Cockpit Lights On
		eventOffName = Cockpit Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 1 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagDecal
	}
}
